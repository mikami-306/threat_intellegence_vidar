title: Office or Explorer Spawning Encoded PowerShell
id: 7e2f0e3a-8c1d-4b6e-9a2f-week8vidaremu01
status: experimental
description: >
    Detects an Office application or Explorer spawning powershell.exe with
    an encoded command, consistent with the initial-access/execution stage
    emulated for the Vidar-style infection chain (Week 8 assignment).
author: <group name>
date: 2026/10/24
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1204/002/
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\POWERPNT.EXE'
            - '\explorer.exe'
    selection_child:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - ' -enc '
            - ' -EncodedCommand '
            - ' -ec '
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate administrative scripts rarely launched from Office/Explorer
level: medium
tags:
    - attack.execution
    - attack.t1059.001
    - attack.initial_access
    - attack.t1204.002
