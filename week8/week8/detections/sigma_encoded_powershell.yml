title: Non-Browser Process Accessing Browser Credential Store Paths
id: 7e2f0e3a-8c1d-4b6e-9a2f-week8vidaremu03
status: experimental
description: >
    Detects a process other than a known browser accessing files that
    resemble browser credential/cookie stores, consistent with the
    collection stage of the Vidar emulation (Week 8).
author: <group name>
date: 2026/10/24
references:
    - https://attack.mitre.org/techniques/T1555/003/
    - https://attack.mitre.org/techniques/T1539/
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFilename|contains:
            - '\User Data\Default\Login Data'
            - '\User Data\Default\Cookies'
    filter_known_browsers:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
    condition: selection and not filter_known_browsers
falsepositives:
    - Browser sync/backup utilities
level: high
tags:
    - attack.credential_access
    - attack.t1555.003
    - attack.t1539
