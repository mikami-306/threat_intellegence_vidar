title: Scheduled Task or Run Key Created by User-Writable Path Binary
id: 7e2f0e3a-8c1d-4b6e-9a2f-week8vidaremu02
status: experimental
description: >
    Detects persistence artifacts (scheduled task or Run key) pointing to a
    binary launched for the loader-based persistence stage emulated in
    Week 8. Vidar itself rarely persists; this covers loaders often
    delivered alongside it.
author: <group name>
date: 2026/10/24
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://attack.mitre.org/techniques/T1547/001/
logsource:
    product: windows
    category: process_creation
detection:
    selection_schtasks:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    selection_reg:
        Image|endswith: '\reg.exe'
        CommandLine|contains:
            - 'CurrentVersion\Run'
    condition: selection_schtasks or selection_reg
falsepositives:
    - Legitimate software installers creating scheduled tasks
level: medium
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.t1547.001
